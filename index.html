<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111318" />
    <meta name="description" content="JapDhara is a peaceful digital Jaap, mala, meditation and spiritual practice app. Let your Jaap flow." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JapDhara — Digital Jaap & Meditation" />
    <meta property="og:description" content="A peaceful journey of every chant. Track your daily Jaap, 108 digital mala, and meditation offline." />
    <meta property="og:image" content="/icon.svg" />
    
    <title>JapDhara — Digital Jaap & Meditation</title>
  </head>
  <body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text min-h-screen antialiased selection:bg-spiritual-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[PWA] SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
